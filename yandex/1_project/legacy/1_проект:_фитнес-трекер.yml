matches:
  - trigger: \1_хороший_старт
    replace: "Привет.\n\nМеня зовут Дмитрий, я твой ревьюер. Буду проверять твой код
      на соответствие отраслевым стандартам. На текущий момент я работаю с фреймворками
      Django и FastAPI.\n\nБуду делиться с тобой своим опытом и, надеюсь, это поможет
      тебе в прохождении курса и дальнейшей разработке. Помни: не важно, с какой скоростью
      ты двигаешься, главное - не останавливайся.\n\nЕсли возникнут вопросы по комментариям
      - пиши в Пачку."
  - trigger: \1_датакласс
    replace: "Существует модуль [dataclasses](https://stackless.readthedocs.io/en/3.7-slp/library/dataclasses.html).
      Из него можно достать декоратор, преобразующий класс в датакласс.\n\nПосле преобразования
      получится контейнерная структура. Такие классы обычно используются для хранения
      статичных данных в удобном виде и, в общем случае, не должны иметь собственной
      логики. Однако, как и большинство \"правил\" в программировании, являются т.н.
      \"guidelines\" - рекомендациями, поэтому никто не скажет \"Нет\" паре методов
      общего назначения поверх самой структуры.\n\n*Примечание: отказ вносить правку
      приведёт к тому, что при переходе от Django на любой микрофреймворк придётся
      дополнительно разбираться в механике датаклассов, что может существенно замедлить
      разработку на грейдах до middle*."
  - trigger: \1_аннотировать_словарь
    replace: "Использование словаря очень к месту. \n\nСловарь можно аннотировать,
      указав тип ключей и тип значений. Чтобы указать тип значений в словаре, воспользуйся
      модулем typing. Попробуй указать, что в значениях словаря стоит Training с подтипами.\n"
  - trigger: \1_аннотировать_список
    replace: "Список можно аннотировать, чтобы показать, из каких типов он состоит.\n"
  - trigger: \1_обработать_ошибку
    replace: Указанного типа может не оказаться в ключах словаря. Стоит обработать.
  - trigger: \1_вынести_строку
    replace: "Строку можно вынести как константу с местозаполнителями. \nЕсли преобразовать
      датакласс в словарь, его можно раскрыть в заготовленную строку."
  - trigger: \1_встроенное_форматирование
    replace: "Подобная функциональность уже вшита в форматирование строк. \n\n[Посмотри
      доку по строкам](https://docs.python.org/3/library/string.html#format-specification-mini-language)"
  - trigger: \1_аннотировать_константы
    replace: Стоит аннотировать классовые константы. В таком случае код будет вызывать
      меньше путаницы.
  - trigger: \1_найс
    replace: "Найс!\n\nТакже можно воспользоваться type."
  - trigger: \1_удалить_декорато
    replace: "Стоит написать объявление атрибутов класса в конструкторе экземпляра
      `__init__`.\n\nДекоратор `dataclass` используется для обозначения класса как
      контейнерного. Подразумевается, что в таких классах присутствуют только атрибуты
      и они не содержат в себе дополнительной логики. В нашем же случае Training и
      её наследники содержат, в основном, логику."
  - trigger: \1_присвоение_атрибутам
    replace: "Стоит заменить присвоение атрибутов на вычисление переменных.\n\nДобавление
      к классу атрибутов по ходу исполнения программы - плохая практика.\n"
  - trigger: \1_лишнее_переопределение
    replace: "Лишнее переопределение конструктора.\n\nВсе соответствующие атрибуты
      будут унаследованы."
  - trigger: \1_нейминг
    replace: Рекомендую найти более описательное название коэффициенту.
  - trigger: \1_исключение
    replace: "Рекомендую сделать бросок одного из [встроенных исключений](https://docs.python.org/3/library/exceptions.html#exception-hierarchy).\n
      \nВ таком случае программа корректно отреагирует на некорректные данные. Исключение
      можно обработать блоком `try-except`. При попытке возврата методом объекта строки
      исполнение программы закончится некорректно."
