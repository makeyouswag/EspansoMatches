matches:
  - trigger: \1__pass
    replace: "Лишний pass.\n\nУ метода есть докстринг.\n"
  - trigger: \1__по_всем
    replace: "Лишний цикл по всем сегментам змеи.\n\nДостаточно рисовать только голову
      и иногда затирать хвост. Чтобы затереть хвост, достаточно отрисовать ячейку
      с цветом бэкграунда. Цвет отрисовки достаточно пробросить в виде аргумента метода
      draw_cell.\n\nПри самоукусе нужно стирать все с доски и новую змею заново."
  - trigger: \1__head
    replace: Стоит воспользоваться методом `.get_head_position()`
  - trigger: \1__cell
    replace: "Рекомендую добавить в базовый класс метод отрисовки 1 ячейки: `.draw_cell()`.\n
      \nПоложение отрисовки нужно пробросить через аргумент метода. Таким же образом
      стоит пробросить и цвет отрисовки - так можно будет затирать последнюю ячейку."
  - trigger: \1__next_direction
    replace: "Лишний атрибут экземпляра.\n\nДостаточно пробросить через позиционный
      аргумент метода."
  - trigger: \1__распаковать
    replace: Стоит распаковать голову змеи по координатным осям.
  - trigger: \1__оператор
    replace: Лишняя условная конструкция. Для вычисления координат змеи после выхода
      за границы поля достаточно воспользоваться оператором `%`.
  - trigger: \1__reset
    replace: Чтобы устранить дублирование, рекомендую вынести инициализацию атрибутов
      в `.reset()` и воспользоваться им в конструкторе.
  - trigger: \1__randomize
    replace: Не факт, что позиция не будет занята. Нужно проверять на уже занятые
      позиции. Для этого методу нужен дополнительный позиционный аргумент и перебор
      позиций циклом.
  - trigger: \1__dict
    replace: "Чтобы не плодить условную конструкцию, достаточно воспользоваться словарём
      вида:\n\n```python\nTURNS = {\n    (pg.K_UP, LEFT): UP,  # Нажатая клавиша, старое направление -> Новое направление \n    (pg.K_UP, RIGHT): UP, \n    ...\n}\n```\n\nТогда обновлять направление змеи можно будет воспользовавшись методом `.get()` словаря. `.get()` в качестве ключа должен будет принимать кортежи:\n\n\n```python\nnew_direction = TURNS.get((key, new_direction), old_direction)\n ```\n\n\nСтоит заметить, что не при всех нажатиях должно меняться направление. Конструкция, приведённая в примере, помогает сразу отсеять случаи, когда новое направление несовместимо с текущим.\n\n\nДля проверки клавиши поворота можно воспользоваться следующим выражением, составив его из объявленного словаря:\n\n```python\nTURN_KEYS = set(event_key for event_key, _ in TURNS)\nif event.key in TURN_KEYS\n```\n"
  - trigger: \1__elif
    replace: Так как в предыдущем ветвлении делается `raise`, рекомендую объявить
      новую условную конструкцию вместо использования `elif`.
  - trigger: \1__самопересечение
    replace: Обработка самопересечения должна быть в `.main()`.
  - trigger: \1__тернарник
    replace: "Вместо использования условной конструкции можно воспользоваться тернарным
      оператором.\n\nТакже нужно обновить последний элемент `.last`, присвоив результат
      выполнения метода `.pop()`."
  - trigger: \1__draw
    replace: Достаточно отрисовывать голову и затирать хвост.
  - trigger: \1__direction
    replace: Змейка должна инициализироваться с поворотом направо.
  - trigger: \1__slice
    replace: Поиск лучше начинать с 4 позиции, т.к. раньше самопересечения не может
      произойти.
  - trigger: \1__некорректный_словарь
    replace: "Текущие обработчики поворотов некорректны. Направление должно меняться
      на новое, если направление нажатой клавиши ортогонально старому направлению.
      В противном случае должно отдаваться старое направление.\n\n```python\nTURNS
      = {\n    (pg.K_UP, LEFT): UP, \n    (pg.K_UP, RIGHT): UP, \n    (pg.K_DOWN,
      LEFT): DOWN,\n    ...\n}\ndef handle_keys(...):\n    ...\n    new_direction
      = TURNS.get((key, new_direction), old_direction)\n```"
  - trigger: \1__лишние_направления
    replace: "Есть лишние направления. Если нажать клавишу, совпадающую с направлением, направление не поменяется. Так же направление не поменяется, если будет нажата клавиша с направлением, противоположным текущему. Остаются только направления, перпендикурярные текущему."