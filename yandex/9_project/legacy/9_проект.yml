matches:
  - trigger: \9_хороший_старт
    replace: "> Добро пожаловать на командный проект! \n\n- Нужно поработать над разделением проекта на слои\n- Нужно поработать над
      API\n- Нужно поработать над моделями\n- Нужно поработать над приложением users\n
      \n\nПредлагаю вместе порадоваться твоему назначению на роль лида проекта ;)\n\nПроект объёмен, поэтому правки буду вносить постепенно. Если нужно прояснить
      моменты - пиши в Пачку.\n"
  - trigger: \9_хрупкая_декомпозиция
    replace: "Хрупкая декомпозиция.\n\nЕсли кто-то невзначай решит воспользоваться
      данным сериализатором в запросе на запись, то он не будет блокировать запись
      в БД. \n\nСтоит предупредить возможные изменения всех полей данного сериализатора."
  - trigger: \9_get_or_404
    replace: Стоит воспользоваться шорткатом `.get_object_or_404()`.
  - trigger: \9_поменять_местами
    replace: "Стоит поменять местами проверки на GET и PATCH.\n\nВ случае проверки
      на GET получится сделать быстрый возврат ответа и уменьшить уровень вложенности
      кода.\n"
  - trigger: \9_all
    replace: "Ошибка: **Не по ТЗ**\n\nСтоит заменить на конкретные поля, указанные
      в ТЗ."
  - trigger: \9_индекс
    replace: "Стоит проиндексировать поля, по которым происходит фильтрация.\n\n-
      Category: slug\n- Genre: slug"
  - trigger: \9_идентичны
    replace: "Контроллеры `GenreViewSet()` и `CategoryViewSet()` практически идентичны.\n
      \nСтоит унаследовать их от дополнительного базового контроллера."
  - trigger: \9_lower
    replace: "Ошибка: **Не по ТЗ**\n\nЛишнее использование метода `.lower()`."
  - trigger: \9_username
    replace: Не хватает валидатора поля.
  - trigger: \9_order_by
    replace: "Лишнее использование `.order_by()`.\n\nСтоит объявить сортировку по
      умолчанию."
  - trigger: \9_наследовать_мета
    replace: "Классы `Meta()`
      [моделей](https://docs.djangoproject.com/en/4.1/topics/db/models/#meta-inheritance)
      и 
      [сериализаторов](https://www.django-rest-framework.org/api-guide/serializers/#serializer-inheritance)
      можно наследовать."
  - trigger: \9_raise
    replace: "Стоит воспользоваться аргументом raise_exception при проверке, чтобы
      уменьшить вложенность кода.\n\n"
  - trigger: \9_пагинация
    replace: "Продублированный класс пагинации.\n\nСтандартная пагинация объявлена
      в настройках DRF."
  - trigger: \9_тех_поле
    replace: "Не стоит сортировать сущность по техническому полю.\n\nДанная сортировка
      непредсказуема, так как в общем случае значения ключей хранятся в случайном
      порядке."
  - trigger: \9_обманчиво
    replace: "Обманчивое название.\n\nКто случайно воспользуется данным контроллером
      в качестве родительского, получит в придачу много ненужных плюшек."
  - trigger: \9_лишний_валидатор
    replace: "Лишний метод валидации.\n\nВ поле `serializers.()` уже встроен подобный
      валидатор."
  - trigger: \9_role
    replace: Стоит рассчитать как максимальную длину значений ROLE_CHOICES.
  - trigger: \9_year
    replace: Стоит объявить функцию-валидатор поля year.
  - trigger: \9_функция
    replace: Стоит вынести проверку на me и регулярное выражение в функцию-валидатор,
      и затем воспользоваться методом одновременно в моделях и в сериализаторах.
  - trigger: \9_default_score
    replace: "Некорректное использование параметра по умолчанию. Он не описывает реальное
      поведение пользователя.\n\nВ общем случае, если оценку пользователя считать
      случайной, распределение вероятностей оценок пользователей будет нормальным.
      В дефолтном случае пик нормального распределения будет приходиться на центр
      кривой, соответственно, наиболее вероятная оценка будет 5. Тем не менее, ни
      значение 1, ни значение 5, ни использование дефолтных значений коэффициентов
      кривой не опишут реального положения вещей.\n\nСтоит оставить поле обязательным
      к заполнению."
  - trigger: \9_4
    replace: "Хорошая работа!\n\nНа данном проекте тебе довелось настроить слаженный
      процесс поставки кода с двумя другими разработчиками. \n\nПроект соответствует
      требованиям к стилю кода на фреймворке Django."
  - trigger: \9_api
    replace: "Рекомендую делить апи по бизнесовому назначению и сшивать всё в маршрутизаторах.\n\n
    ```python\n
        \"\"\"\n
    |-api\n
    \t|-users\n
    \t\t|- serializers.py\n
    \t\t|- urls.py\n
    \t\t|- views.py\n
    \t|-reviews\n
    \t\t|- filters.py\n
    \t\t|- serializers.py\n
    \t\t|- urls.py\n
    \t\t|- views.py\n
    \turls.py  # И прочие общие моменты\n
    \"\"\"\n
    ```
    "
  - trigger: \9_mvc
    replace: "
    Нужно ознакомиться с шаблоном [MVC](https://www.geeksforgeeks.org/mvc-design-pattern/).

Для грамотного разделения бизнес-логики проекта можно ознакомиться со [статьёй](https://habr.com/ru/companies/vivid_money/articles/544856/?code=043e22b8b8915d4cbb37b7f7f44f5515&state=gKJi3tpsWxeDpIqbeiUgaNBs&hl=ru), объясняющей недостатки использования стандартной функциональности Django в контексте реализации шаблона MVC, а также посматривать на [стайлгайд джанго](https://github.com/HackSoftware/Django-Styleguide?tab=readme-ov-file#how-to-use-it).
    "
