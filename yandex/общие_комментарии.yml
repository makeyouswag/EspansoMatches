  - trigger: \подбор
    replace: "Методологический антипаттерн: **[Программирование методом подбора](https://ru.wikipedia.org/wiki/Программирование_методом_подбора)**\n
      \nИтеративный подход к разработке кода, когда программист не понимает до конца
