matches:
  - trigger: \импорты
    replace: "Импорты должны быть сгруппированы в следующем порядке:\n\n- Импорты
      из стандартной библиотеки\n- Импорты сторонних библиотек\n- Импорты модулей
      текущего проекта\n\n**После каждой группы импортов должна стоять пустая строка.**\n
      \n**Рекомендация курса**: каждый набор из сгруппированных импортов сортировать
      по алфавиту. \n**Цель**: тратить меньше времени на поиск импортов. Когда кодовая
      база вырастет, этот приём будет экономить время при чтении.\n\n*Примечание:
      В Pycharm для оптимизации импортов есть отдельный шорткат*"
