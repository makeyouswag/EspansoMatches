  - trigger: \guard_clause
    replace: "Стоит воспользоваться [guard clause](https://refactoring.guru/ru/replace-nested-conditional-with-guard-clauses)
      (быстрый возврат). \n\n### Суть:\n\n> Обработать граничные условия задачи так,
      чтобы сразу вернуть готовый результат, уменьшив уровень вложенности условий\n
      \n### Как работает\n\n```python\ndef method(vars:dict):\n\t\"\"\"\n\tКод выглядит
      рабочим, но есть место для улучшений\n\t\"\"\"\n\terrors = []\n\tif vars:\n\t
      \tif vars[\"bruh\"]:\n\t\t\terrors.append(vars[\"bruh\"])\n\t\telse:\n\t\t\t
      result = process_vars(vars)\n\tif errors:\n\t\traise ValueError(errors)\n\t
      if not vars:\n\t\traise ValueError(\"Empty input\")\n\treturn result\n```\n\n
      ### Пользуемся guard clause\n\n```python\ndef method(vars: dict):\n\tif not
      vars:  # Обрабатываем граничное условие и не проходим всю логику, если пришёл
      пустой словарь\n\t\traise ValueError(\"Empty input\")\n\terrors = []\n\tif vars[\"\
      bruh\"]:\n\t\t# Обрабатываем ещё одно граничное условие и сразу выбрасываем
      исключение по нужному условию\n\t\traise ValueError(vars[\"bruh\"])\n\t# Возвращаем
      результат обработки общего случая\n\treturn process_vars(vars) \n```\n\n> Также
      бывают ситуации, когда нужно обработать только конкретный случай. Тогда можно
      воспользоваться конструкцией-**предохранителем**\n\n\n### Использование исключения
      в качестве предохранителя:\n\n```python\ndef method(vars: dict):\n\tif not vars:\n
      \t\t# Обработали граничное условие\n\t\traise ValueError(\"Empty\")\n\tif \"\
      key\" in vars:\n\t\t# Обработали единственный частный случай, который нас интересует\n
      \t\treturn process_key(vars['key'])\n\t# Выбросили исключение во всех остальных
      случаях\n\traise ValueError(\"Unexpected input structure\")\n```\n\nПодобный
      предохранитель защищает код от нежелательного исполнения: некорректное исполнение
      программы всегда сложнее обработать, чем падение с исключением. Некорректное
      исполнение может вернуть с виду корректные, однако, нежелательные, данные."
