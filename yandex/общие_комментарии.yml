  - trigger: \разработка_под_бизнес
    replace: "Грамотный разработчик должен разбираться в предметной области и разрабатывать систему с учётом тонкостей этой области. Обычно он должен ставить бизнесовую область и бизнесовые задачи выше технических - на этом этапе развития разраба технологии становятся инструментом моделирования процессов бизнесовой области, из-за чего нельзя зацикливаться только на коде.\n
    Так как бизнес-процессы подвижны и расширяемы, таковыми и должны быть разрабатываемые под бизнес системы. Единственное, что делает бизнес при успехе - расширяется ещё больше. Из-за этого я делаю такой большой акцент на расширяемости приложения: чаще система требует именно этого. Сениор знает, куда может сдвинуться проект с точки зрения бизнеса, мидлу же приходится выкручиваться, т.к. предсказать что-то наверняка не получится, особенно, если новичок в области.\n
    При этом, разработчик всё ещё остаётся инженером, а в инженерном деле есть понятие \"оверинжиниринг\" (по-русски: \"перемудрил\"). Так, к примеру, преждевременная оптимизация является антипаттерном - нужно оптимизировать код только по необходимости, иначе можно столетиями тыкаться в побайтовую оптимизацию кода, не реализовав ни одной фичи.\n
    Инженерный подход итеративен, и ничто не мешает вернуться к предыдущей разработке и модифицировать её (разумеется, если это позволяет устройство системы; в крайней стадии запущенности в проект становится невозможно вносить изменения: что-то да сломается). [Пример инженерного подхода хорошо показан на этом видосе](https://www.youtube.com/watch?v=6cOy5xn8e6E)."
  - trigger: \comments
    replace: "Большое числ комментариев разжижает кодовую базу и делает программу менее читаемой. Код должен быть понятным без комментариев. Объяснения рекомендую писать в докстрингах."