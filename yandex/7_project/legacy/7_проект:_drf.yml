matches:
  - trigger: \7_basename
    replace: "Не хватает параметра `basename`.\n\nНазначения параметра:\n- Прямое:
      для вычисления URL по этому имени\n- Косвенное: на классах контроллеров можно
      не писать поле `.queryset`, если определён метод `.get_queryset()`\n\nСитуация
      аналогична использованию параметра name при регистрации маршрутов: параметр
      не является обязательным, но в крупном проекте без него не обойтись, т.к. у
      каждой операции той или иной бизнес-сущности может оказаться кастомная логика. "
  - trigger: \7_контроль_автора
    replace: "Не хватает контроля сериализации связанного поля для автора.\n\nМы не
      контролируем, как будет проходить преобразование модели User в строку.\n"
  - trigger: \7_роутер
    replace: "Стоит дать роутеру имя, содержащее номер версии API.\n\nПолезно вводить
      в код версионирование как можно раньше.\n"
  - trigger: \7_хороший_выбор
    replace: Хороший выбор для контроля сериализации автора.
  - trigger: \7_all
    replace: "Можно воспользоваться шорткатом \"все поля\".\n\nЕсли в посте изменится
      набор полей, придётся проводить дополнительные изменения в данном месте. В случае,
      если нужно будет отдавать только определённые поля на каком-либо контроллере,
      можно будет отнаследоваться от данного сериализатора и ограничить набор полей
      вручную.\n\n[Смотри доку](https://www.django-rest-framework.org/api-guide/serializers/#specifying-which-fields-to-include). "
  - trigger: \7_определение_поста
    replace: "Определение поста дублируется в методах `.get_queryset()` и `.perform_create()`.\n
      \nСтоит вынести данную операцию в отдельный метод."
  - trigger: \7_read_only
    replace: Стоит вынести в read_only_fields, чтобы собрать всю информацию о полях
      с доступом на чтение в одном месте.
  - trigger: \7_вынести
    replace: "Определение поста повторяется в методах `.get_queryset()` и `.perform_create()`.\n
      \nСтоит вынести операцию в отдельный метод."
  - trigger: \7_удачный_тип_поля
    replace: Удачный выбор типа поля для контроля сериализации автора.
  - trigger: \7_удачный_контроллер
    replace: Удачный выбор родительского контроллера.
  - trigger: \7_property
    replace: "Можно обернуть метод в декоратор `@property`. Получится дополнительный
      метод класса, который работает как атрибут. \n\nСтоит учитывать, что полученный
      атрибут должен иметь соответствующее название."
  - trigger: \7_модификаторы_доступа
    replace: "Можно ограничить доступ внешних классов к атрибуту / методу. \n\nСмотри
      [модификаторы доступа](https://python-scripts.com/object-oriented-programming-in-python#access-modifiers)."
  - trigger: \7_менеджер
    replace: "Стоит добавить метод выборки.\n\nВ результате данной операции мы получаем
      [объект менеджера](https://docs.djangoproject.com/en/4.1/topics/db/managers/),
      а не ожидаемую выборку."
  - trigger: \7_pk_related_field
    replace: "Таким же образом `ModelSerializer()` производит сериализацию полей связи
      под капотом.\n\nСтоит убрать продублированную логику."
  - trigger: \7_админка
    replace: Не хватает админки и зарегистрированных в ней моделей.
  - trigger: \7_на_чтение
    replace: "Контроллер должен поддерживать только операции чтения, однако, подобное
      наследование подразумевает полную реализацию CRUD-операций.\n\nСтоит отнаследоваться
      от более подходящего контроллера."
  - trigger: \7_raise
    replace: "Стоит воспользоваться аргументом raise_exception при проверке, чтобы
      уменьшить вложенность кода.\n\nСериализатор автоматически вернёт 400 ответ,
      если возникнут ошибки валидации."
