    "
  - trigger: \7_check_unittest_content
    replace: "
    Надо исправить:\n\n
    - В классе TestCase для этого модуля не надо переопределять setUpTestData\n
    - Нужен отдельный тест для проверки, что заметка не в списке для не-автора. Нельзя совмещать его с тестом для автора, тк там только одна проверка\n
    - Брать первый элемент из object_list можно только предварительно сделав проверку на то, что элемент там один\n
    - Так как object_list это QuerySet - все проверки на количество делаем с .count() а не len()\n
    - Объекты сравниваем напрямую, а не по id или каким-то другим полям\n
    - В subTest обязательно нужен параметр для идентификации тестов в выводе\n
    - В тесте на наличие формы в контексте обязательно использование assertIsInstance для проверки типа формы\n\n
    ---\n
    Можно лучше:\n
    - Проверять, что заметки нету в списке заметок не-автора можно с помощью self.assertNotIn(self.note, notes)\n
    - В тесте что страница содержит форму self.assertIsInstance(self.author_client.get(url).context.get('form'), NoteForm) можно делать так, чтобы совместить две проверки: форма есть в контексте и проверку типа\n
    - У объектов в тестах проверяются все предметные поля на соответствие ожидаемым
    "
  - trigger: \7_check_unittest_logic
    replace: "
    Надо исправить:\n\n
    - В тесте создания обязательна проверка, что создается один объект. Для этого надо либо удалить все записи из бд в тесте, либо сделать assert на то, что их 0. Далее в тесте делаем assert count == 1 и достаем единственный объект с помощью .get() без параметров\n
    - Аналогично для теста, что аноним не может создать объект. Так как нужно проверить, что в базе данные не создались и не поменялись, самый надежный способ это сделать - нужно удалять все записи из базы и проверять что их 0.\n
    - Все посылаемые данные выносим в константы и в assert сравниваем с этими константами\n
    - Там где нужен доступ к состоянию объекта до запроса - нельзя делать .refresh_from_db(), так как теряется доступ к прежнему состоянию\n
    - Отсутствие объекта в базе проверяется с помощью assert not filter(pk=pk).exists() , именно так и никак иначе. По PEP8 нельзя сравнивать с True или False\n
    - Нельзя проверять наличие объекта с помощью assert x in X.objects.all() - это неэффективно\n
    - Поля объектов созданные через запрос с формой обязательно сравнивать с полями формы, которую передавали в запрос.\n
    - В тесте на то, что аноним не может создать заметку сравниваем количество заметок в БД до и после запроса\n
    - В тесте на невозможность создать заметку с неуникальным слагом первую заметку обязательно создавать средствами ORM. Не надо два раза делать http-запрос\n
    - В тех тестах, где после запроса происходит редирект - его обязательно проверить\n
    - Повторяющийся в тестах код выносим в методы\n\n
    ---\n
    \n
    Можно лучше:\n
    - При проверках объектов всегда проверяем все предметные поля\n
    - В тесте удаления также рекомендуем проверять все предметные поля объекта, чтобы убедиться, что попытка удаления не исказила объект.\n
    "
