    - Один раз извлекаем урлы и клиентов из фикстур с помощью lazy_fixture\n
    \n
    ---\n
    \n
    Можно лучше:\n
    - Разместить клиента в наборе кейсов, чтобы в будущем тестировать разных клиентов
