matches:
  - trigger: \7__константа
    replace: Фикстуры, не реализующие какую-то логику, а просто предоставляющие константу
      создавать не нужно - их надо делать именно константами в модуле с тестами.
  - trigger: \7__autouse
    replace: "Рекомендую следующую фикстуру, чтобы открыть доступ к базе всем тестам.
      Она будет вызываться перед каждым тестом.\nВ этом случае будет не нужен декоратор
      `@pytest.mark.django_db` или глобальная переменная `pytestmark = pytest.mark.django_db`.\n
      \n```python\ndef enable_db_access_for_all_tests(\n    db,  # noqa \n):\n   \
      \ pass\n```"
  - trigger: \7__комментарии
    replace: Не хватает фикстуры, создающей комментарии.
  - trigger: \7__урлы
    replace: Нужны отдельные фикстуры всех урлов, объявленных с помощью `reverse()`.
  - trigger: \7__routes
    replace: "Проверки на коды ответа и редиректы достаточно реализовать в 2 метода.\n\
      \n```python\n@pytest.mark.parametrize(\n    'url, client_, code',\n    (\n \
      \       (DELETE_URL, AUTHOR_CLIENT, HTTPStatus.OK),\n\t\t...\n    ),\n)\ndef
      test_status_codes(\n    url, client_, code\n): \n    assert client_.get(url).status_code
      == code\n\n\n@pytest.mark.parametrize(\n    'url, expected_url',\n    (\n  \
      \      (DELETE_URL, DELETE_URL_REDIRECT),\n        (EDIT_URL, EDIT_URL_REDIRECT),\n\
      \    ),\n)\ndef test_anonymous_redirects(client, url, expected_url):\n    assertRedirects(client.get(url),
      expected_url)\n```"
  - trigger: \7__запрещенные_слова
    replace: "Можно проверить не одно запрещённое слово, а все. Для этого нужно параметризовать
      тест:\n\n```python\n@pytest.mark.parametrize('bad_word', BAD_WORDS)\n```"
  - trigger: \7__exists
    replace: Проверку на существование/несуществование экземпляра нужно делать в виде
      `assert filter(pk=pk).exists()` / `assert not filter(pk=pk).exists()`.
  - trigger: \7__count
    replace: Объект в контексте - QuerySet. На нём нужно использовать метод `.count()`
  - trigger: \7__неудобный_доступ
    replace: Неудобный доступ. Нужно объявить адреса как отдельные фиктуры.
  - trigger: \7__get
    replace: 'Нужно достать объект заново из базы, воспользовавшись методом `.get()`. '
  - trigger: \7__login
    replace: Авторизацию клиентов нужно провести при настройке класса тестов в `.setUpTestData()`
  - trigger: \7__subtest
    replace: Нужно воспользоваться `subTest()`, чтобы все непрошедшие проверки корректно
      отображались в результатах тестов.
  - trigger: \7__сравнить_с_начальным
    replace: "Чтобы проверить число записей после создания/редактирования, нужно зафиксировать
      исходное число записей.\n\nТакже можно опираться на пустоту таблицы проверяемой
      модели."
  - trigger: \7__тесты_маршрутов
    replace: "Все проверки статусов ответа нужно объединить в 1 метод с циклом по
      случаям.\n\nКаждый конкретный случай можно описать 3 значениями:\n\n- URL\n- Клиент\n- Код возврата\n\nВ качестве контейнера достаточно использовать список
      со списками.\n\n```python\ncases = [\n    [PAGE, client, status_code],\n   \
      \ [ANOTHER_PAGE, another_client, status_code],\n    …\n]\n```\n"
  - trigger: \7__базовый_класс
    replace: "Нужно создать базовый класс тестов, который будет хранить в себе константы
      и атрибуты.\n\n
      Константы: \n\n
      - Имена пользователей \n
      - Постоянные слаги \n
      - Постоянные реверсы; реверсы, зависящие от постоянных данных\n\n
      
    Атрибуты:\n\n
      - Пользователи\n
      - Группы, которые используются для создания и проверки редактирования постов\n
      - Тестовые посты (в т.ч. множество постов для теста пагинатора)\n
      - Реверсы, зависящие от пользователей / постов / групп, объявленных в базовом тесте\n
      - Авторизованный и неавторизованный клиенты, от лица которых идут обращения к API\n\n\n
      Остальные классы тестов стоит наследовать от базового класса и пользоваться
      соответствующими атрибутами. Базовый класс вместе с константами стоит вынести
      в отдельный файл."
  - trigger: \7__лишняя_промежуточная_фикстура
    replace: Лишняя фикстура. Достаточно взять атрибут напрямую.
  - trigger: \7__создание_комментариев
    replace: 'Некорректное создание комментариев. 
    Моделью используется поле auto_now_add, которое отрабатывает при срабатывании `.save()` модели. 
    При использовании [bulk_create()](https://docs.djangoproject.com/en/5.1/ref/models/querysets/#bulk-create) метод не отрабатывает. '
  - trigger: \7_лишняя_фикстура
    replace: "Лишняя фикстура. Достаточно объявить константу."
  - trigger: \7_реверсы
    replace: "> Общее замечание\n\n
    Рассчитывать все маршруты (читай: вызовы метода `.reverse()` и постоянные адреса),
     применяемые в тестах на unittest, нужно заранее.\n\n
     Возможные типы маршрутов:\n\n
     - Полные константы.
     \nНапример, \"главная страница\"\ .\n

     - Зависящие от константных текстовых данных.
     \nСтраница группы зависит от *постоянного* слага.
     \nСтраница пользователя зависит от *постоянного* ника.\n

     - Зависящие от вычисляемых данных.\n
     Страница поста зависит от ключа поста.\n\n

     Полностью постоянные URL и зависящие от постоянных данных стоит объявить **на
      уровне модуля**.\n
    Динамические URL стоит задавать как **классовые или экземплярные атрибуты** `cls.<attribute name>` 
    или `self.<attribute name>` сразу после появления нужных данных 
    (в фикстуре или результате метода).\n\n

    Стоит помнить, что константы записываем капсом после объявления импортов."
  - trigger: \7_bulk_create
    replace: "Некорректное создание множества объектов.\n\n- Список созданных объектов
      не объявляется как атрибут класса теста\n- N запросов в базу для создания N
      объектов\n\nНеобходимо воспользоваться методом, который позволит создать множество
      объектов модели за 1 запрос. Рекомендую найти метод в [описании интерфейса QuerySet](https://docs.djangoproject.com/en/4.1/ref/models/querysets/)."
  - trigger: \7_особенности_bulk_create
    replace: "Хорошее применение метода. Позволяет создать все посты в один запрос.\n
      \nВ доке можно прочитать про [особенности метода](https://docs.djangoproject.com/en/4.1/ref/models/querysets/#bulk-create)
      (в частности, про несрабатывание метода `Model.save(self, *args, **kwargs)`
      и несрабатывание [сигналов](https://docs.djangoproject.com/en/4.1/topics/signals/)).\n"
  - trigger: \7_check_pytest_conftest
    replace: "
    Надо исправить:\n\n
    - Фикстуры, не реализующие какую-то логику, а просто предоставляющие константу создавать не нужно - их надо делать именно константами в модуле с тестами.\n
    - В декораторе @pytest.fixture скобки не нужны, если нет дополнительных параметров\n
    - Размещать клиента в параметрах фикстуры нельзя! Надо создавать внутри фикстуры, чтобы не мутировать глобальный\n
    - В фикстуре, создающей несколько объектов News обязательно использование bulk_create. Возвращать что-то из этой фикстуры не нужно\n
    - bulk_create принимает в качестве параметра генераторное выражение, а не list comprehension, соответственно квадратные скобки не нужны\n
    - В фикстуре создающей комментарии, нельзя использовать bulk_create, для того, чтобы верно отрабатывал auto_now_add\n
    - В conftest.py размещаем фикстуры всех урлов, обязательно с помощью reverse\n
    - Часто в фикстуре с урлом редактирования комментария передают news.id в качестве аргумента для reverse - это неверно, должен использоваться id комментария\n\n
    ---\n
    \n
    Можно лучше:\n
    - 7_autouse\n
    - ЛПП
    "
