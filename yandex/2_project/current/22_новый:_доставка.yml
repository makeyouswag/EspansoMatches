matches:
  - trigger: \2__ограничить_длину
    replace: "### Рекомендация курса.    \n\nРекомендуется ограничить длину строк
      в разметке как в Python-коде, т.е. до 80 символов.\n\nСтоит учитывать, что разметка
      - гибкий инструмент. В большинстве мест переносы строк работают одинаково, и
      этим можно и нужно пользоваться.\n\nПри этом можно добавлять сдвиги (два пробела),
      показывая тем самым уровень вложенности разметки."
  - trigger: \2__некорректный_источник
    replace: "Ошибка: **Некорректный источник данных**. \n\nНельзя брать посты из
      списка по индексу. Приходящий с API id это значение ключа `id` в словаре из
      списка.\n\n---\n\nОшибка: **Мало контроля**. \n\nПараметрам контроллеров нельзя
      доверять - приходящие на эндпоинт значения могут оказаться некорректными. Например,
      поста с id 1234 не существует, однако, его можно попробовать достать через эндпоинт
      (и получить 500 ответ сервера).\n \nНужно достоверно знать, что пост с таким
      ключом есть в заготовленном наборе (впоследствии данный набор будет расположен
      в базе данных).\n\nСхематично данная проверка выглядит следующим образом. \n
      \n```python\nif <условие>:\n    raise <исключение>(\"<детали проблемы>\")\n
      ```\n\nНужно подобрать подходящее [штатное исключение](https://docs.python.org/3/library/exceptions.html#exception-hierarchy),
      которое удовлетворяет ситуации.\n\nТакже можно воспользоваться Django-типом
      `Http404()`.\n"
  - trigger: \2__запутывающий_титул
    replace: "Запутывающий титул.\n\nСтраница категорий говорит о **публикациях**
      в категории. Титул же главной страницы говорит о **записях**. \n\nСтоит определиться
      с терминологией и подобрать шаблону более подходящий титул."
  - trigger: \2__хороший_старт
    replace: "Хороший старт!\n\nТак как это твой первый пуш проекта Django в репозиторий
      Github, нужно почистить репо от ненужных директорий:\n\n- Удалить директорию
      `blogicum/html`. Это часть ТЗ с примерами, соответственно, она на не нужна на
      ревью.\n- Удалить директорию `blogicum/static_dev/css` (но не из локальных файлов)
      - её содержимое не являетсяя уникальным.\n\nПравки указаны, если возникают вопросы
      по ревью или застреваешь - пиши мне в Пачку."
  - trigger: \2__gitignore
    replace: "Стоит вынести в `.gitignore` следующие директории:\n\n- static\n- static-dev\n
      - html"
  - trigger: \2__хорошее_условие
    replace: "Хорошее условие.\n\nПозволяет не плодить промежуточные переменные и
      лаконично обозначает логическую область."
  - trigger: \2__sorted
    replace: "Метод `.sort()` изменяет входной параметр weights.\n\nРекомендую воспользоваться
      встроенным методом `sorted()`."
  - trigger: \2__left
    replace: "Некорректное название переменной.\n\nОна указывает на самое лёгкое/тяжёлое
      положение робота. "
  - trigger: \2__else
    replace: "Лишний else.\n\nИмеются операции, которые будут выполняться вне зависимости
      от попадания в условную конструкцию."
  - trigger: \2__comprehension
    replace: Список с весами достаточно собрать в 1 строку, воспользовавшись [списковым
      включением](https://www.geeksforgeeks.org/python-list-comprehension/).
