matches:
  - trigger: \2_related_name
    replace: "В связи не хватает явного объявления аргумента related_name. Несмотря
      на то, что Django добавляет свой вариант, лучше явно прописать атрибут. Впоследствии
      вызов связанной модели будет выглядеть более лаконично.\n\n```python\n<экземпляры>
      = <модель>.<название обратного отношения>.<метод выборки>()\n```\n"
  - trigger: \2_ordering
    replace: "Мы два раза используем одинаковую конструкцию для выдачи моделей в отсортированном
      порядке: здесь и в контроллере group_list. В дальнейшем также могут появиться
      контроллеры, использующие подобную сортировку.\n\nВ модели стоит указать сортировку
      по умолчанию. [Ознакомься с классом `Meta` и его атрибутом ordering.](https://docs.djangoproject.com/en/4.1/ref/models/options/#ordering)\n"
  - trigger: \2_обратное_отношение
    replace: "Посты группы стоит найти по [обратному отношению](https://docs.djangoproject.com/en/4.1/topics/db/examples/many_to_one/):\n
      \n```python\nпосты = группа.<related_name>.<метод выборки>\n```"
  - trigger: \2_set_null
    replace: "При установке аргументов `null=True, blank=True` пост может существовать
      и без группы. SET_NULL позволит оставлять связанные посты при удалении группы.\n"
  - trigger: \2_склеится
    replace: "Текст может быть многострочным, но у HTML есть особенность: любая последовательность
      пробельных символов (пробелов, табов, концов строк) заменяется при отображении
      на один пробел. То есть, длинный текст может склеиться.\n\nК тегу стоит применить
      фильтр, чтобы сохранить деление текста на строки. Синтаксис будет следующим:
      \n\n```python\n {{group.description| <tag filter>}}\n```\n\n[Посмотри фильтры
      для шаблонов](https://docs.djangoproject.com/en/4.1/ref/templates/builtins/#built-in-filter-reference).\n"
  - trigger: \2_авто
    replace: Комментарий сгенерирован Django автоматически. Такое удаляем.
  - trigger: \2_head
    replace: Стоит вынести мета-теги из `head` в отдельный подключаемый шаблон.
  - trigger: \2_article
    replace: "Неудачное применение тега <article>.\n\nЛучше заключать в него отдельные
      посты, а не всю ленту целиком.\n"
  - trigger: \2_карточка_поста
    replace: Карточку поста можно вынести в подключаемый шаблон.
  - trigger: \2_лишняя_контекстная_переменная
    replace: "Лишняя контекстная переменная. \n\nАвтор контроллера не должен навязывать
      шаблону тексты - это работа верстальщика (человек, редактирующий шаблоны). Из
      контроллера в шаблон передаются только хранимые в БД данные, а также дополнительные
      переменные.\n"
  - trigger: \2_указать_группу
    replace: "Местозаполнитель.\n\nСтоит указать группу, на страницу которой зашёл
      пользователь."
  - trigger: \2_указать_описание_группу
    replace: "Местозаполнитель.\n\nСтоит указать описание группы."
  - trigger: \2_запутывающий_related_name
    replace: "Запутывающий related_name. \n\nК примеру, если мы достаём посты группы,
      то получим:\n\n```python\ngroup_posts = group.group.all()\n```\n\nТогда как
      нам нужно получить выражение, более близкое к естественному языку:\n\n```python\n
      group_posts = group.posts.all()\n```"
  - trigger: \2_пустой_div
    replace: "Лишний пустой тег `<div>`.\n\n"
  - trigger: \2_title
    replace: Не хватает `{% блока титула %}`, чтобы дочерние шаблоны могли определять
      его самостоятельно.
  - trigger: \2_мета
    replace: "Некорректное использование `Meta()`. \n\nПример по использованию смотри
      в [документации](https://docs.djangoproject.com/en/4.1/topics/db/models/#meta-options)."
