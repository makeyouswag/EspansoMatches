  - trigger: \10_векторизация
    replace: "Цикл можно заменить на одно присвоение:\n\n```python\nresult[:<first
      zero position>] = [<first zero position> - position for position in range(<first
      position>)]\n```\n\nАналогично можно поступить с остальными циклами в теле алгоритма.
      Подобная операция называется векторизацией.\n\n*Примечание: векторизовать нужно
      либо все циклы, либо ни одного.*\n\n> Векторизация - отказ от использования
      нативного цикла Python в пользу делегирования вычислений на более низкий уровень
      абстракции.\n\n**Суть векторизации** - представление исходных данных как однородных
      (т.е. с одинаковыми типами).\n\n**Цель векторизации**: делегировать перебор
      на ядро Python (т.е. на компилируемый язык С, циклы в котором на порядки быстрее
      нативного Python).\n\n**Плюсы метода**: на больших выборках может значительно
      ускорить операции (в сотни и более раз).\n\n**Минусы метода**: для ускорения
      задействуется дополнительная память. Из-за этого появляются дополнительные расходы
      на её выделение. В нашем случае это значит, что при большом количестве нулей
      в исходных данных векторизация не окупится.\n\n\n## Почему арифметические операции
      в Python медленные?\n\nРассмотрим прибавление 1 к каждому элементу списка длиной
      в 1 000 000 значений.\n\n```python\nnums = range(1_000_000)\n\nfor num in nums:\n\
      \    num += 1\n```\n\n Для каждого значения операция будет включать в себя следующие
      этапы:\n\n1. Поиск типа\n2. Поиск метода сложения данного типа с int\n3. Вызов
      метода сложения\n4. Конвертирование Python-объектов в машинные целые числа\n
      5. Сложение машинных чисел\n6. Оборачивание результата сложения в Python-объект\n
      7. Поиск следующего элемента в списке, что также является накладной операцией\n
      \nВидно, что если проводить расчёты ближе к машинному уровню, то уйдёт значительная
      часть т.н. overhead'а. Этим и занимается векторизация. \n\nСуществует пакет
      [numpy](https://pypi.org/project/numpy/), который предоставляет интерфейс для
      векторизации данных и работы с векторами. В частности, числа в numpy - машинные."
