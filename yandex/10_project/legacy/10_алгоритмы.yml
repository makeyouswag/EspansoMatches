  - trigger: \10_улица
    replace: "Алгоритм получился нетехнологичным по ряду критериев:\n\n- Сложен для
      понимания **=>** Сложен в поддержке\n- Не является гибким **=>** Не готов к
      изменениям в ТЗ. Алгоритм решает узкую задачу, и при изменении ТЗ придётся переписывать
      его заново\n- Представляет собой решение-трюк (некорректно подобраны используемые
      технологии), что ограничивает его использование в промышленной среде\n\n\n###
      Критерии хорошего алгоритма:\n\n- Код основного вычислительного метода написан
      ясно: без финтов, трюков, сальто мортале; на общеизвестных инструментах твоего
      стека\n- Ход исполнения программы очевиден. Должно быть видно, какие цепочки
      вызовов присутствуют в программе. В этом хорошо помогают чистые функции\n- Метод
      достаточно гибок для принятия новых изменений\n\nСтоит запомнить негласное правило:
      \n\n> Кто код писал, тот его и поддерживает\n\nЕсли разработчику сложно адаптировать
      алгоритм под изменения в требованиях, то другим будет ещё сложнее. По итогу
      запутанный код выльется в потраченные впустую человекочасы.\n\n---\n\n### Рекомендация\n
      \nЧтобы развязать получившийся код, воспользуйся следующим алгоритмом. Можешь
      считать его за уточнённое ТЗ:\n\n1. Найти за 1 проход все нулевые места. В этом
      тебе помогут list comprehensions\n2. Перебрать 3 случая, заключённые в следующих
      промежутках (что даст ещё ровно 1 проход):\n - До первого нулевого\n - Между
      соседними нулевыми\n - После последнего нулевого\n3. Для каждого дома будет
      известно положение ближайшего нулевого или ближайших двух. Их можно использовать
      для явного вычисления расстояния\n\n---\n\n### Разделение ответственности в
      программном модуле\n\nДанный курс - курс промышленного программирования. \n\n
      Ключевой навык, вырабатываемый курсом - умение создавать полезные переиспользуемые
      детали. Я.Контест в этом случае является площадкой для обкатывания получившихся
      деталей.\n\nЧтобы разделить переиспользуемую часть от тестирующей, добавь в
      модуль [блок исполнения](https://ru.stackoverflow.com/questions/515852/Что-делает-if-name-main):\n
      \n```python\nif __name__ == \"__main__\":\n    ...\n```\n\nВсё, что выше данного
      блока - публичная часть модуля, доступная для переиспользования. Всё, что ниже
      - тестирующий блок для получившихся компонентов."
