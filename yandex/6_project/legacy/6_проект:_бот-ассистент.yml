matches:
  - trigger: \6_файл_лога
    replace: "Мы не контролируем, где именно будет создан файл с логом: мы знаем имя
      файла, но папка будет зависеть от *текущей папки процесса* к моменту загрузки
      модуля.\n\nРешение: опереться на конкретную папку или файл.\n\nНеплохие варианты:\n
      \n- Домашняя папка пользователя\nДоступна во всех ОС через `os.path.expanduser('~')`\n
      - Файл этого модуля. Доступен как магическая константа `__file__`ф"
  - trigger: \6_токены
    replace: "Нужно залоггировать все пропущенные токены.\n\nДля доступа к значению
      константы по её имени есть встроенный словарь globals. Следовательно, перебор
      можно организовать так:\n\n```python\nfor token_name in <token_names: Union[list,
      set, tuple]>:\n    if globals()[token_name]:\n        ...\n```"
  - trigger: \6_вынести_фразы
    replace: "> Общее замечание\n\nИз кода функций / методов принято выносить человекочитаемые
      фразы. \n\nЕсли поменяется ТЗ (например, если нужно будет выдавать ответ на
      другом языке), то это не потребует изменений в логике кода.\n\nВыносят на уровень
      модуля, вместе с конструкциями '...{}...', если таковые имеются. Вычисленные
      значения пробрасывают в ключевые/позиционные аргументы.\n\nПример:\n\n```python\n
      MY_TEMPLATE = \"String with {my_key} in template\"\ndef my_method():\n    my_value
      = ...\n    use_template(MY_TEMPLATE.format(my_key=my_value))\n```\n\nХорошей
      практикой также является вынесение констант в дополнительный модуль (или модули,
      разделённые по назначению)."
  - trigger: \6_лог_исключения
    replace: "У методов логгера есть параметр `exc_info=True`, который стоит применять
      после перехвата исключения. Он позволяет получить более подробное описание ошибки
      вместе с трейсбеком.\n\nТакое же дополнение можно реализовать, использовав `.exception()`
      вместо  `.error()`."
  - trigger: \6_базовое_исключение
    replace: "Бросая базовый Exception, мы лишаем вызывающих гибкого поведения - так
      делать нельзя. \n\n[Стоит подобрать встроенную ошибку, соответствующую обрабатываемому
      случаю](http://hgrecco.github.io/searchpydocs/current/library/exceptions.html#exception-hierarchy)."
  - trigger: \6_отлов_базового_исключения
    replace: "Неудачный тип исключения для отлавливания. Здесь стоит ловить конкретный
      тип, а не общий (общий используется для обозначения \"последнего рубежа\").
      \n\nСтоит посмотреть документацию к `requests.get()` и использовать исключения
      из пакета `requests`."
  - trigger: \6_реагирование
    replace: "Самое главное, что нужно запомнить про запросы:\n\n> Все запросы через
      сеть ненадёжны. Упасть может что угодно и где угодно.\n\n## Программа может
      отвалиться по следующим причинам:\n\n### Отказы сети\n\nПроявляются в виде исключений,
      прилетающих от вызовов `requests.get()` или `requests.post()`\nДанные исключения
      нужно ловить и обрабатывать.\n\n### Отказы сервера\n\nЗапрос может дойти до
      сервера, сервер вернёт ответ, но в нём будет только \"Упс! Что-то пошло не так\"\
      .\nСервер может присылать подобные ответы: у него может быть перегруз, ремонт,
      он может не получить ответ от следующего сервера в цепочке вызовов.\nПодобную
      ситуацию стоит ожидать и, следовательно, обрабатывать. Для обработки нужно знать,
      где сервер размещает информацию о проблеме.\nПотенциальные места: ключи `error`
      или `code` в `.json()`.\n\n### Неожиданный формат ответа\n\nЧастая ситуация.
      Разработка серверов зачастую продолжается, из-за чего могут меняться форматы
      ответов на эндпоинтах. \nЭто не одобряется, но не может быть запрещено.\nЭто
      означает, что все операции с полученными данными могут дать сбой:\n\n- Нет нужного
      ключа\n- Несоответствие ожидаемого и полученного типа данных\n\nК подобным сбоям
      стоит готовиться. Для этого можно делать **\"аварийный возврат\"**.\nДля этого
      стоит составить текстовое описание проблемы и включить в него общее описание,
      детали ситуации (такие как параметры запроса, чтобы данный запрос потом можно
      было воспроизвести). Этот текст затем стоит передать в конструктор исключения,
      подобрав подходящий для ситуации тип:\n\n```python\ndef my_code():\n    ...\n\
      \    except KeyError as error:\n        raise KeyError(ERROR_MESSAGE.format(URL,
      headers, data))\n```\n\n---\n\nДля того, чтобы код получался отказоустойчивым,
      нужно научиться реагировать на отказы. \nСтратегии:\n\n- **\"Последний рубеж\"\
      **\nЭто место отлова всех исключений. \n**Важно**: именно здесь происходит логгирование
      всех проблем.\nВ нашем случае последний рубеж - блок `except Exception` в методе
      `main()`. Это единственное место в коде, где допускается отлов базового исключения.\n
      - **\"Игнорирование ¯\\_(ツ)_/¯\"**\nЕсли участок кода выбросил исключение, но
      добавить нечего, то данное исключение мы пропускаем\n- **\"Аварийный возврат\"\
      **\nЕсли к описанию проблемы есть, что добавить, то после отлова выбрасывается
      новое дополненное исключение. Логгирование при этом делегируется \"последнему
      рубежу\"."
  - trigger: \6_stream_handler
    replace: "Не хватает сохранения лога в файл.\n\nПока бот на сервере, сохрание
      \"в поток\" и доступ к сохраненному обеспечивает сервер. Но ведь ничто не мешает
      запустить бота локально - это может быть полезно для отладки.\n\nСтоит учитывать,
      что потребуется файл с точным местом хранения.\nРекомендация: опираться на какую-нибудь
      конкретную папку или конкретный файл.\n\nПретенденты: \n\n- Домашняя папка пользователя.
      \nОна доступна во всех ОС, например, через `os.path.expanduser('~')`.\n- Файл
      этого модуля. Он доступен как магическая константа `__file__`.\n\nРекомендую
      сохранить как `__file__ + '.log'`."
  - trigger: \6_дополнить
    replace: "Стоит добавить в описание проблемы все параметры запроса к серверу (URL,
      хэдеры, параметры запроса). \n\nОни могут понадобиться при поиске причин ошибки
      по логу."
  - trigger: \6_вынести_из_блок
    replace: "Стоит вынести конструкцию после блока try-except.\n\nОтлавливается ошибка
      метода `requests.get()`."
  - trigger: \6_некорректный_джейсон
    replace: "Может прийти некорректный джейсон. \n\nСтоит посмотреть на потенциальные
      исключения метода `.json()` и обработать данные случаи."
  - trigger: \6_подобрать_ошибку
    replace: "Некорректное использование ошибки ``.\n\n[Стоит подобрать встроеную
      ошибку, соответствующую обрабатываемому случаю](http://hgrecco.github.io/searchpydocs/current/library/exceptions.html#exception-hierarchy)."
  - trigger: \6_аварийный_возврат
    replace: "Стоит реализовать аварийный возврат. \n\nДостаточно выбросить ошибку,
      в которой стоит указать описание проблемы. Данная ошибка будет перехвачена на
      последнем рубеже, который залогирует текст ошибки.  \n\nТаким образом читающему
      разработчику будет показано, что исполнение программы было некорректным."
  - trigger: \6_basic_config
    replace: "Нужно вынести настройки логгера в блок  [`if __name__ == '__main__'`](https://ru.stackoverflow.com/questions/515852/Что-делает-if-name-main).
      \n\nВ таком случае настройки бота не будут затрагивать глобальное состояние
      логгера."
