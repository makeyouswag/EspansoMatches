matches:
  - trigger: \6__reverse
    replace: Внутри метода стоит воспользоваться методом `.reverse()`. `.reverse_lazy()`
      нужен для взятия реверса в аргументе success_url, а не в методе `.get_success_url()`.
      [Смотри 
      пример](https://stackoverflow.com/questions/48669514/difference-between-reverse-and-reverse-lazy-in-django).
  - trigger: \6__в_отдельный_миксин
    replace: "Вьюхи удаления и обновления комментария отличаются только 1 родительским
      миксином. Стоит объединить логику в отдельный миксин.\n\n"
  - trigger: \6__вынести_аннотацию
    replace: "Аннотацию стоит вынести в дополнительный метод кастомного `QuerySet()`
      и пользоваться чейном при необходимости:\n\n```python\n#  Как может выглядеть
      выборка с разными методами одного и того же кастомного QS\nPost.objects.published().annotate_comments()\n\
      ```"
  - trigger: \6__order_by
    replace: Лишний вызов `.order_by()`. Сортировка уже объявлена в модели.
  - trigger: \6__get_object
    replace: Интерфейс дочернего метода должен повторять родительский. Под интерфейсом
      метода понимается набор аргументов метода, с помощью которых можно с ним взаимодействовать.
  - trigger: \6__админка_комментариев
    replace: Не хватает регистрации модели комментариев в админке.
  - trigger: \6__dispatch
