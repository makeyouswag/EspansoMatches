matches:
  - trigger: \3__encoded
    replace: "Обычно всё зашифрованное существует в двух состояниях - зашифрованное
      и расшифрованное. Их общепринятое название - `decoded` и `encoded`.\n\nВ качестве
      аргумента основного метода приходит зашифрованная строка - `encoded`."
  - trigger: \3__запутывающее_название
    replace: "Запутывающее название переменной цикла: `letter` - буква (a...z), однако,
      символы в зашифрованной строке ими не ограничены.\n\nРекомендую что-то из:\n
      - sign\n- symbol"
  - trigger: \3__однопроходно
    replace: "Алгоритм достаточно реализовать однопроходно без использования вложенных
      условий и нумерации. Достаточно проходить по символам строки циклом for.\n\n
      Рассмотрим проверку символов при дешифровании:\n1. В первую очередь интересуют
      числа, т.к. считаем повторы последующих символов. Фиксируем число повторов символов
      в отдельную переменную.\n2. Если символ - одна из скобок, придётся работать
      со стеком. Если скобка открылась - добавляем подсчёт в стек и обнуляем временный
      результат, чтобы была возможность считать вложения. Если скобка закрылась -
      достаём подсчёт из стека и обновляем строку-результат.\n3. В остальных случаях
      же получаем повторяемые символы. Собираем их в строку-результат - при данном
      действии не имеет значения, что было в строке-результате до этого символа или
      же после.\n\nПосле прохода по всем символам строки достаточно вернуть итоговую
      строку-результат."
  - trigger: \3__хорошее_условие
    replace: "Хорошая условная конструкция.\n\nВ достаточном виде описывает все возможные
      преобразования при дешифровании."
  - trigger: \3__пересобрать_условие
    replace: "Необходимо пересобрать условие так, чтобы в результат настакивались
      любые символы, кроме цифр и скобок.\n"
  - trigger: \3__правильный_стек
    replace: Все действия со стеком корректны.
  - trigger: \3__лишние_переменные
    replace: "Лишние переменные на строках $|$.\n\nСкладываемые значения достаточно попарно
      складывать в стек и попарно же доставать и добавлять в итоговый результат -
      дополнительных промежуточных переменных в действиях не требуется."
  - trigger: \3__digits
    replace: Проверку на вхождение в цифры лучше сделать через `string.digits`. Данную
      строку стоит преобразовать в множество, т.к. проверка на вхождение в множестве
      происходит за О(1).
  - trigger: \3__число_повторов
    replace: "Число повторов рекомендую фиксировать в переменной-строке. \n\nВ таком
      случае достаточно будет складывать всё в одну переменную, а преобразование типов
      провести 1 раз при возврате из стека."
