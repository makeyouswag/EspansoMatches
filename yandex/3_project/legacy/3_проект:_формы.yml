matches:
  - trigger: \3_обрезать_текст
    replace: "Текст может оказаться очень большим - стоит его обрезать.\n\nРезультат
      выполнения метода будет виден в shell и в админке (пользователь его не видит)
      - поэтому обычно данным методом выводят различную мета-информацию модели (id,
      поля связи, описание и т.п.)\n"
  - trigger: \3_index
    replace: "Определение страницы повторяется в контроллерах index, group_posts и
      profile. \n\nСтоит устранить дублирование, определив дополнительную функцию.\n"
  - trigger: \3_посты_автора
    replace: "Посты автора стоит найти по [обратному отношению](https://docs.djangoproject.com/en/4.1/topics/db/examples/many_to_one/):\n
      \n```python\nпосты = автор.<related_name к модели юзера>.<метод выборки>\n```\n"
  - trigger: \3_пройдёмся
    replace: "Пройдёмся по контроллеру в целом:\n\n- Проверка на метод запроса является
      лишней\n- Есть повторяющиеся render \n- Есть нагромождение условных конструкций. \n
      - Форма создаётся дважды\n\nСуществует пара трюков, которая поможет нам разгрести
      кашу.\n\n## Трюк 1\n\n```python\nform = PostForm(request.POST or None)\n```\n
      \nВыражение `request.POST or None` выдаст словарь со значениями заполненной
      формы, если это был POST-запрос (булевское значение request.POST будет True).
      Если был GET-запрос, то выражение выдаст None, что эквивалентно `form = PostForm()`.\n
      \n## Трюк 2\n\nВместо прямого контроля за методом запроса (`request.method ==
      'POST'`), достаточно оставить проверку валидности формы:\n\n- При POST-запросе
      форма уже будет валидна\n- При GET-запросе форма всегда будет невалидной: значения
      полей отсутствуют, валидатору нечего проверять\n\n### Прагматический принцип
      программирования\n\nПринцип поможет нам отсортировать условные конструкции. \n
      \n> Сначала проверяй условия, дающие быстрый возврат.\n\nВ нашем случае это
      означает, что нам выгодно проверить форму на НЕ-валидность и вернуть рендер
      пустой формы.\n\nСобрав всё вместе, получим следующую картину:\n\n```python\n
      def new_post(req):\n    form = Form(req.POST or None)\n    if not form.is_valid():\n
              return render(...)\n    post = form.save(...)\n    ...\n    return redirect(...)\n\
      ```\n"
  - trigger: \3_отрефакторить
    replace: "Стоит отрефакторить контроллер по образу и подобию .post_create()\n\n"
  - trigger: \3_элементарные_расчёты
    replace: "Лишняя контекстная переменная. \n\nЭлементарные расчёты лучше делать
      на месте, чтобы не засорять контекст."
  - trigger: \3_select_related
    replace: "Можно подтянуть авторов и группы, используя [метод select_related](https://docs.djangoproject.com/en/4.1/ref/models/querysets/#select-related).
      \n\n```\nпосты = группа.посты.select_related('автор', 'группа')\n```\n\nЭто
      позволит не делать дополнительные запросы в БД, если нам понадобится доставать
      информацию из связанных моделей.\n"
  - trigger: \3_вынести_форму
    replace: Форму стоит вынести в подключаемый шаблон.
