matches:
  - trigger: \15_хороший_старт
    replace: "> Добро пожаловать на дипломный проект!\n\nТы прошёл тернистый
      путь к этой точке, и в этом проекте ты докажешь, что уровень твоих инженерных
      навыков уже далёк от начального. Путь программиста - это путь постоянного преодоления,
      ведь только решая сложные задачи человек учится чему-то действительно новому.
      С опытом приходит техника, а затем и решение задач превращается в рутину.\n\n
      Что ж, я отвлёкся.\n\nХороший старт!\n\n- Нужно поработать над API\n\n
      - Нужно поработать над приложениями\n\n- Хорошие модели\n\nПрорабатывать
      проект будем постепенно, так как он достаточно объёмен."
  - trigger: \15_routing
    replace: "Лишнее ветвление.\n\nЧтобы добавить дополнительные методы на уже существующий
      экшен в виде дополнительного экшена, рекомендую воспользоваться [рекомендациями
      по маршрутизации](https://www.django-rest-framework.org/api-guide/viewsets/#routing-additional-http-methods-for-extra-actions)."
  - trigger: \15_related_name
    replace: "Стоит объявить значение поля related_name по умолчанию.\n\nЗначения
      поля одинаковы для данной модели. Смотри [опции `Meta()` моделей](https://docs.djangoproject.com/en/4.1/topics/db/models/#meta-options)"
  - trigger: \15_регулярка
    replace: "Стоит вынести регулярное выражение в атрибут соответствующей модели.\n\
      \n"
  - trigger: \15_custom_qs
    replace: "Крайне громоздкая условная конструкция на уровне контроллеров.\n\nСтоит
      объявить кастомный `QuerySet()`, на который можно будет делегировать фильтрации,
      и воспользоваться его методами на API.\n\nКастомный QS можно использовать в
      качестве менеджера модели:\n\n```python\n\nclass CustomQuerySet(models.QuerySet):\n\
      \    def custom_method(self, ...):\n        ...\n\nclass CustomModel(models.Model):\n\
      \    ...\n    objects = CustomQuerySet.as_manager() \n\n```"
  - trigger: \15_api
    replace: "
      API нужно разделить на подпакеты, ориентированные на работу с указанными бизнес-сущностями.\n\n
      Также нужно придерживаться [MVC](https://www.geeksforgeeks.org/mvc-design-pattern/).
      Для грамотного разделения бизнес-логики проекта нужно ознакомиться со [статьёй](https://habr.com/ru/companies/vivid_money/articles/544856/), 
      объясняющей недостатки использования стандартной функциональности Django в контексте реализации шаблона MVC, 
      а также посматривать на [стайлгайд джанго](https://github.com/HackSoftware/Django-Styleguide?tab=readme-ov-file#how-to-use-it).
      Должно получиться следующее:\n\n
      ```python\n
      \"\"\"\n
      |- api # Слой API: контроллеры и отображение \n 
      \t|- recipes\n
      \t\t ...\n
      \t\t|- routers.py\n
      \t\t|- serializers.py\n
      \t\t|- urls.py\n
      \t\t|- views.py\n
      \t|- users\n
      \t\t|- ...\n
      \t\t|- routers.py\n
      \t\t|- serializers.py\n
      \t\t|- urls.py\n
      \t\t|- views.py\n
      \t|- ... # И так делать для каждой сущности
      |- urls.py  # Общий маршрутизатор API\n
      |- ... # И прочие приблуды для апи \n
      |- recipes  # Слой моделей\n
      \t|- apps.py\n
      \t|- admin.py  # Спорный момент, т.к. админка это однозначно слой отображения\n
      \t|- models.py\n
      \t|- validators.py\n
      \t|- ...
      |- users  # Слой моделей\n
      \t|- apps.py\n
      \t|- admin.py\n
      \t|- models.py\n
      \t|- validators.py\n
      \t|- ...\n
      \"\"\"\n
      ```\n
      "
  - trigger: \15_вынести_модели
    replace: "Модели можно и нужно вынести в отдельный слой (читай: в отдельное приложение).\n
      \nТогда будет чёткое распределение логики проекта на слои. Django/DRF, как и
      прочие дефолтные фреймворки, оперируют шаблоном MVC. Следовательно, органичная
      архитектура приложения будет выглядеть следующим образом:\n\n```\nCustomProject\n
      |- api\n    |- ...\n|- CustomProject\n|- apps\n    |- ingredients\n    |- recipes\n\
      \        |- __init__.py\n        |- admin.py\n        |- apps.py\n        |-
      models.py\n        |- ...\n    |- ...\n```"
  - trigger: \15_5
    replace: "Отличная работа!\n\nНа текущей стадии развития как разработчика ты показала
      себя как отменный специалист - с горящими глазами и волей к самосовершенствованию.
      Храни в себе эти качества - получаемые от них дивиденды растут экспоненциально.
      \n\nК подобным качествам также относятся, к примеру, критическое мышление и
      поставленная речь - профит от них виден только на длинной дистанции. Тем не
      менее, никому ещё не мешало исследовать грани своих возможностей. Подобные же
      навыки - отличный способ поставить долговременный и затягивающий эксперимент
      по саморазвитию с однозначно положительным исходом, и нет в жизни чего-либо
      более увлекательного, чем выстраивание своей личности и наблюдение за её изменениями.
      Ещё Аристотель говорил: \"Мы это то, что мы делаем постоянно. Следовательно,
      отличие есть привычка, а не действие.\"\n\nСледуй намеченному пути и не сбивайся
      с курса."
  - trigger: \15_4
    replace: "Хорошая работа!\n\nЗа курс ты действительно освоил целый набор инструментов
      по автоматизации процессов, а данная работа - прямое тому доказательство. Путь
      разработчика тернист, и это только начало твоего долгой и захватывающей дороги
      в мире разработки. \n\nБудь смелым, будь способным, и люби своё дело.\n"
  - trigger: \15_рецепт
    replace: "1. Обдаём кипятком помидоры, чтобы было проще снять шкурку. Нарезаем
      помидоры кубиками и складываем в отдельную ёмкость.\n\n2. Нарезаем лук кубиками.
      Откладываем в отдельную ёмкость\n\n3. Наливаем в сковороду немного масла, ставим
      на средний огонь и дожидаемся, пока на нём можно будет готовить. Это можно проверить,
      брызнув небольшим количеством воды на сковороду. \n\n4. Выкладываем лук, жарим
      до прозрачности. \n\n5. Выкладываем фарш. По мере прожарки разбиваем его лопаткой
      на более мелкие части, пока не получится однородная с луком масса. Жарить обязательно
      без крышки - в противном случае получится фарш, сваренный в собственном соку.\n
      \n6. Получив однородный поджаренный фарш с луком, выкладываем помидоры. Накрываем
      сковороду крышкой. \n\n7. Дожидаемся, когда помидоры дадут сок, добавляем соль,
      итальянские травы и томатную пасту. Доводим до готовности в течение 10-15 минут,
      временами помешивая.\n\n8. После добавления специй можно отварить макароны.
      Берём капеллини, потому что их быстрее всего приготовить без снижения качества.
      \n\n9. Пока варятся макароны и доходит фарш, можно натереть сыр.\n\n10. Дожидаемся
      готовности компонентов. Выкладываем капеллини, обильно посыпаем сыром, выливаем
      на них соус болоньезе\n\nВы превосходны! Не хуже, чем в этих ваших рэсторанах."
  - trigger: \15_можно_деплоить
    replace: "Проект можно деплоить.\n\nК нему стоит прописать полноценный README-файл,
      в котором нужно указать адрес сервиса.\n\nТакже рекомендую расширить список
      ингредиентов, т.к. я хочу приготовить спагетти болоньезе."
  - trigger: \15_http_method_names
    replace: Лишнее переопределение экшенов для выдачи 405 ответа. Достаточно объявить
      атрибут http_method_names, указав в нём доступные методы контроллера.
