matches:
  - trigger: \14_отличный_старт
    replace: "Отличный старт!\n\nСтоит добавить файл .dockerignore для прокси.\n\n
      Если нужно прояснить моменты - пиши мне в Пачку."
  - trigger: \14_вынести_секрет
    replace: Стоит вынести секрет в переменные окружения.
  - trigger: \14_энв
    replace: Можно вынести в переменные окружения
  - trigger: \14_хосты
    replace: "В продакшен окружении хосты должны быть указаны явно.\n\nСтоит указать
      хостов и вынести их в переменные окружения."
  - trigger: \14_секрет_по_умолчанию
    replace: У секрета не может быть значения по умолчанию. Он обязан быть прописан
      в переменных окружения. В данном случае - в .env файле или же в окружении контейнера.
  - trigger: \14_debug
    replace: Нельзя разворачивать промышленное приложение со включенным режимом дебага.
  - trigger: \14_переменные_окружения
    replace: "Переменные окружения - набор переменных окружения проекта (будь то сервер
      на Linux, локальный компьютер или Docker-контейнер), который позволяет регулировать
      поведение системы без вмешательства в кодовую базу со стороны разработчика.\n"
