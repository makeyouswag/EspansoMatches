matches:
  - trigger: \11_ошибка_проектирования
    replace: "Ошибка проектирования. \n\nКонтейнер не имеет права возвращать ничего,
      кроме хранимых значений.\n\nСтоит сделать аварийный возврат: \n\n```python\n
      class ContainerStructure:\n    def structure_method(self, *args, **kwargs):\n\
      \        raise <Your exception>(<Error description>)\n```\n\nРекомендую в первую
      очередь искать подходящие штатные исключения, т.к. их можно обрабатывать на
      лету, т.е. без импортирования сторонних исключений.\n\nТакже рекомендую объявить
      дополнительный метод, чтобы не дублировать логику обработки заполненности дека.\n\
      \n"
  - trigger: \11_обработка_getattr
    replace: "Ошибка проектирования. \n\nНекорректная реация на сбой `.getattr()`.
      ЯКонтест ожидает в принтах только ответы дека. \n\nЛучше делать аварийный возврат."
  - trigger: \11_собрать
    replace: "Можно собрать результаты в список и распечатать значения принтом:\n\n
      ```python\nresult = []\n<collect your result here>\nprint(*result, sep=\"\\\
      n\")\n```"
  - trigger: \11_однотипные_операции
    replace: "Посмотрим на логику методов `.push_front()` и `.push_back()`:\n\n- В
      первом случае сначала сдвигается указатель, потом происходит сохранение\n- Во
      втором - сначала сохраняется значение, потом сдвигается указатель\n\nВидно,
      что используются 2 разных логики для действий одного типа. Подобная реализация
      потребует двойного сопровождения, что удваивает шансы на ошибку как с твоей
      стороны, так и со стороны других разработчиков. \n\n\nЛучше перейти на единую
      логику, при этом, не важно, какую: \n\n- Можно считать, что оба указателя смотрят
      на крайнюю занятую ячейку\n- Можно, что на крайнюю свободную ячейку\n\nРекомендую
      первый вариант: память сначала выделяется, потом в нее помещается значение.
      Стоит учитывать, что любой выбор потребует изменений в инициализации полей.\n
      \n> Как понять, какими должны быть значения указателей в начальном положении?\n
      \nВозьмём на вооружение первый вариант логики - оба указателя смотрят на крайнюю
      занятую ячейку. \n\nПусть в деке находится 1 элемент. Тогда указатели будут
      в положениях `head = 1; tail= 1; size = 1`.\nУдалим единственный элемент из
      указателя головы структуры. В таком случае каждый из указателей сдвинется на
      1 \"влево\". Результатом данной операции  и будут нужные значения."
  - trigger: \11_перестраховаться
    replace: "Метод может выбросить исключение.\n\nСтоит его обработать. Следует помнить,
      что упасть может что угодно и где угодно."
  - trigger: \11_инкапсулировать
    replace: "Стоит объявить дополнительный публичный метод модуля, чтобы инкапсулировать
      логику обработки символов и выполнения обнаруженных операций.\n\nСтек при этом
      можно объявить как необязательный аргумент метода."
  - trigger: \11_getattr
    replace: "Лишний ручной перебор с большим количеством повторов. Достаточно заметить,
      что имена операций и имена методов совпадают. \n\nСуществует [штатный метод](https://docs.python.org/3/library/functions.html),
      с помощью которого можно достать атрибут класса по имени (в данном случае -
      метод класса). Вызвать полученные методы можно сразу же.\n\nСтоит учитывать,
      что при вызове метода нужно перестраховаться, т.к. метод может выбросить исключение."
  - trigger: \11_оцифровщик
    replace: "Стоит сделать универсальнее.\n\nДля работы Калькулятора не важна конкретная
      функция, превращающая \"строки в числа\" (оцифровщик).\n\nПусть функция получает
      \"оцифровщик\" необязательным параметром со значением  `int()` по умолчанию.
      Тогда калькулятор сможет работать и с числами типа float/complex/Decimal/Rational/Complex/...."
  - trigger: \11_штатным
    replace: "Настоятельно рекомендую сначала искать [подходящие штатные исключения](https://docs.python.org/3/library/exceptions.html#exception-hierarchy),
      прежде чем создавать или импортировать кастомные.\n\nСторонний разработчик сможет
      отлавливать подобные исключения на лету, т.е.без импорта сторонних библиотек
      или модулей."
  - trigger: \11_нейминг_модуля
    replace: "Название модуля не описывает его содержимое.\n\nСтоит переименовать
      файл. [Рекомендации по неймингу описаны в PEP](https://peps.python.org/pep-0008/#package-and-module-names)."
  - trigger: \11_deque
    replace: "Обманчивое название.\n\nЭто  **Deque** (сокр. Double-ended queue - двусторонняя
      очередь)."
  - trigger: \11_аварийный_возврат
    replace: "Стоит сделать аварийный возврат и отлавливать ошибки в блоке исполнения
      модуля: \n\n```python\nclass ContainerStructure:\n    def structure_method(self,
      *args, **kwargs):\n        raise <Your exception>(<Error description>)\n\n\n
      if __name__ == \"__main__\":\n    try:\n        ...\n    except <Your exception>:\n\
      \        print(...)\n```\n\nРекомендую в первую очередь искать подходящие штатные
      исключения, т.к. их можно обрабатывать на лету, т.е. без импортирования сторонних
      исключений."
  - trigger: \11_инициализация
    replace: "Противоречивая инициализация полей`.head` и `.tail`.\n\nТакие указатели
      смотрят на разные типы ячеек и ведут себя по разному, хотя в ТЗ оба конца дека
      описаны одинаково.\n\n> Как понять, какими должны быть значения указателей в
      начальном положении?\n\nПредположим, что дек использует единую логику для указателей
      `head` и `tail`.\n\n1. Выберем единую логику для указателей. Пусть оба указателя
      смотрят на первые ячейки, занятые в направлении изменений\n2. Тогда при 0 элементов
      указатели будут находиться в исходном положении. При этом нам известно, что
      буфер при добавлении 1 элемента должен показывать  `head = 1; tail= 1; size
      = 1`\n2. Удалим единственный элемент из указателя головы структуры и сдвинем
      указатели в направлении их изменений. Результатом данной операции будет изначальное
      состояние дека."
  - trigger: \11_operator
    replace: Стоит воспользоваться штатным пакетом [operator](https://docs.python.org/3/library/operator.html)
      и сделать маппинг входных значений на соответствующие методы.
  - trigger: \11_classmethod
    replace: "Лишний декоратор.\n\nОн используется для обозначения метода класса.
      Данный метод должен иметь другую сигнатуру - он принимает на вход не экземпляр
      класса, а сам класс.\n\n```python\nclass ExampleClass:\n    @classmethod\n \
      \   def example_class_method(cls, *args, **kwargs):\n        pass\n\n    def
      example_method(self, *args, **kwargs):\n        pass\n```"
  - trigger: \11_модификаторы_доступа
    replace: "Стоит ограничить доступ внешних классов к атрибутам внутренней логики
      дека. \n\nСмотри [модификаторы доступа](https://python-scripts.com/object-oriented-programming-in-python#access-modifiers)."
  - trigger: \11_property
    replace: 'Можно обернуть метод в декоратор `@property`. Получится метод класса,
      который работает как атрибут. '
  - trigger: \11_маппинг
    replace: "Достаточно создать маппинг символов на операции.\n\nСтоит воспользоваться
      штатным пакетом [operator](https://docs.python.org/3/library/operator.html)
      и сделать маппинг входных значений на соответствующие методы."
  - trigger: \11_неудачная_инициализация
    replace: Проверка потребовалась из-за неудачной инициализации полей. См. выше.
