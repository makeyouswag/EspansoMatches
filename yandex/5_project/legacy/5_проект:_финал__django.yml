matches:
  - trigger: \5_сложный_флаг
    replace: "Сложное назначение флага following.\n\nУ нас есть 2 случая, когда не
      нужно делать запрос в базу. Все 3 условия можно записать в виде 1 булевского
      выражения. Булевские операторы питона [ленивы](https://docs.python.org/2/reference/expressions.html#boolean-operations):\n
      \n```python\nflag_1 = True\nflag_2 = False\nflag_3 = True\n\nmy_boolean_expression
      = flag_2 and flag_1  # Расчёт закончится на flag_2, т.к. стоит операция логического
      И\nanother_boolean_expression = flag_1 and flag_2 and flag_3  # Расчёт выражения
      закончится на flag_2 и выдаст False \n```"
  - trigger: \5_мало_контроля
    replace: "Мало контроля\n\nМы не можем доверять параметрам контроллеров - они
      приходят из маршрутов, которые можно вбить руками. Нужно проконтролировать,
      что подписка между данными пользователями действительно существует.\n\nМожно
      поручить проверку методу get_object_or_404. Тогда промежуточная переменная автора,
      как и сравнение пользователя с автором, станут лишними.\n"
  - trigger: \5_админка
    replace: "Стоит дополнить админку, т.к. появились новые модели.\n"
  - trigger: \5_подключаемый_шаблон
    replace: Подключаемый шаблон ждёт задания флага. Смотри в switcher.html.
  - trigger: \5_новые_модели
    replace: Появились новые модели, стоит расширить тест.
  - trigger: \5_новые_эндпоинты
    replace: Появились новые эндпоинты, стоит расширить тест.
  - trigger: \5_constraints
    replace: "Не хватает [кастомных ограничений](https://docs.djangoproject.com/en/4.1/ref/models/constraints/#module-django.db.models.constraints)
      на уровне базы:\n\n- Нельзя добавлять несколько подписок на одного и того же
      автора\n- Нельзя подписываться на себя\n"
  - trigger: \5_вынести_и_расширить
    replace: "- Можно объявить дополнительный модуль utils.py для вспомогательных
      функций, которые можно переиспользовать, и вынести данный метод в новый модуль\n
      - Можно расширить интерфейс метода, указав ключевой аргумент количества страниц
      по умолчанию. Тогда при желании можно будет использовать кастомное значение"
  - trigger: \5_не_хватает
    replace: "Не хватает отображения:\n\n- Числа подписок\n- Числа подписчиков\n-
      Числа комментариев"
  - trigger: \5_set_up
    replace: "Метод `.setUp()` отрабатывает при запуске каждого из методов класса
      тестов. \n\nСтоит вынести все статические данные в `.setUpClass()`."
  - trigger: \5_уютная_разметка
    replace: "Рекомендую подобную уютную разметку.\n\n```\n<a class=\"btn btn-lg btn-light\"\
      \nhref=\"{% url 'posts:profile_unfollow' author.username %}\"\nrole=\"button\"\
      >Отписаться</a>\n```\n"
  - trigger: \5_get_or_create
    replace: "Лишняя условная конструкция.\n\nДостаточно воспользоваться методом `.get_or_create()`.
      Стоит учитывать, что метод может выбросить исключение."
  - trigger: \5_follow_index
    replace: "Список постов можно достать в 1 действие, используя лукапы связанных
      моделей.\n\nВ твоей голове запрос должен звучать примерно так:\n\n> Посты, у
      авторов которых есть подписчики, совпадающие с request.user."
