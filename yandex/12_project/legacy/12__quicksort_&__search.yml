matches:
  - trigger: \12_декомпозировать
    replace: "Лишние параметры интерфейса сортирующего метода. \n\n- При внешнем вызове
      их можно рассчитать по списку\n- При внутренних вызовах они всегда заданы\n\n
      Достаточно декомпозировать метод, разбив его на 2 вложенных функции - разбиение
      и сама сортировка. Стоит учитывать, что вложенные функции будут видеть параметры
      внешней."
  - trigger: \12_mid
    replace: "Повторное определение `nums[mid]`.\n\nЭто делает код менее эффективным:
      доступ к локальной переменной в 2 раза быстрее доступа к элементу списка."
  - trigger: \12_ответ
    replace: "При `target == nums[left]` нужно делать возврат - это и есть ответ.\n
      \nСтоит учитывать, что это лучше сделать перед основным расчётом."
  - trigger: \12_inplace
    replace: 'Это inplace-сортировка: значения, хранимые в контейнере, сортируются
      в самом контейнере без использования промежуточных.'
  - trigger: \12_доступен
    replace: "Лишний параметр `arr`.\n\nСписок со входа метода будет доступен внутри
      вложенной функции."
  - trigger: \12_while
    replace: "Лишнее использование цикла.\n\nСтоит помнить, что при решении алгоритмических
      задач нужно избегать вложенных циклов. Подобный подход позволяет уменьшить алгоритмическую
      сложность решения."
