matches:
  - trigger: \4__namespace
    replace: Не хватает параметра namespace.
  - trigger: \4__id
    replace: "Некорректное извлечение поста. В текущем виде `posts` представляет собой
      список, проиндексированный по номеру вложенного поста, а не по id поста.\n\n
      Рекомендую объявить словарь, в котором в качестве ключей будут id постов, а
      в качестве значений - объекты постов.\n\n---\n\nНужно обработать случай, когда
      поста с указанным id нет в списке (далее: в базе). Для этого нужно обработать
      случай и выбросить исключение - в таком случае сервер будет отдавать статус
      ответа не 500 (ошибка сервера), а 404 (ошибка клиента - ресурс не найден).\n
      \n```python\nif <condition>:\n    raise Http404\n```"
  - trigger: \4__аннотировать
    replace: Можно аннотировать параметры запроса.
  - trigger: \4__load
    replace: Лишняя подгрузка статики.
  - trigger: \4__вынести
    replace: Рекомендую вынести кастомные контроллеры в конец маршрутизатора, чтобы
      в будущем не затереть стандартные маршруты.
  - trigger: \4__gitignore
    replace: Нужно добавить в gitignore папки static, static-dev, html.
  - trigger: \4__отступы
    replace: "Отступы в html - 2 пробела. Стоит пофиксить отступы в файле.\n\nЧтобы
      Pycharm правильно форматировал шаблоны самостоятельно, достаточно настроить
      стиль кода в настройках:\n\n```\nEditor --> Code Style --> HTML\n\nTab size:
      2\nIndent: 2\nContinuation indent: 4 \n```\n\nОтступы должны присутствовать
      при вкладывании тегов. Это относится как к стандартным HTML-тегам, так и к блокам
      Django и циклам в шаблонах:\n\n```html\n<!-- Нужно так -->\n<div>\n  {% include
      ... %} <!-- 2 пробела -->\n</div>\n\n<!-- Или так -->\n{% block content %}\n\
      \  {% include ... %} <!-- 2 пробела -->\n{% endblock %}\n\n<!-- Или так -->\n
      {% for post in posts %}\n  {% include \"includes/post_card.html\" %} <!-- 2
      пробела -->\n{% endfor %}\n```"
  - trigger: \4__reversed
    replace: "Можно проще: \n\n```python\nlist(reversed(posts)) == posts[::-1]\n```"
  - trigger: \4__base
    replace: Не хватает шаблона `base.html`, в котором будет собрана базовая вёрстка
      всех страниц.
  - trigger: \4__dict
    replace: Рекомендую объявить словарь, в котором в качестве ключей будут id постов,
      а в качестве значений - объекты постов.
  - trigger: \4__титул
    replace: 'Стоит привести титул в соответствие с эталонной вёрсткой: заголовок,
      точка, пробел, дата.'
  - trigger: \4__container
    replace: Стоит обернуть данным тегом блок content в базовом шаблоне.
  - trigger: \4__article
    replace: "Карточку поста можно вынести в подключаемый шаблон. \n\n---\n\n
    Менять отображение карточки можно с помощью пробросов флагов в контекст при подключении блока через `{% include ... with ... %}` "
  - trigger: \4_includes
    replace: "Тег нужно вынести в отдельный подключаемый файл, расположенный в папке `templates/includes`, и подключить его."