matches:
  - trigger: \4_общий_комментарий
    replace: "Хороший старт! Фиксы:\n\n\n## Тесты форм:\n\n- Импортировать модель
      пользователя из моделей\n- Рассчитывать URLы заранее. Заменить расчёт URL редиректов
      на более компактный\n- Сделать логически корректную проверку на тестах создания
      и редактирования поста\n- Добавить изменение группы на тест post_edit. Делать
      проверки относительно полей формы\n- Поменять доступ к группе и посту, объявляемых
      в setUpClass\n\n\n## Тесты моделей:\n\n- Импортировать модель пользователя из
      моделей\n- Удалить лишние промежуточные переменные\n- Вынести магическое число
      в константу модели\n- Вынести повторяющийся код в цикл с subTest\n- Проводить
      проверку полей модели над классом модели, а не над экземпляром\n\n\n## Тесты
      маршрутов:\n\nНе хватает модуля для тестирования маршрутов test_routes.py. Нужно
      проверить, что расчёты дают ожидаемые явные URLы:\n\n- “/” - результат расчёта
      по имени маршрута “index”\n- “/create” - результат расчёта по имени маршрута
      “post_create”\n- “/group*<конкретный слаг>” - результат расчёта по имени маршрута
      “group_list”\n\n## Тесты маршрутизатора:\n\n- Импортировать модель пользователя
      из моделей\n- Упорядочить импорты\n- Рассчитывать URLы заранее\n- Объединить
      проверки кодов возврата в 1 метод с циклом и subTest\n- Дописать проверки редиректов\n
      - Убрать одноразовые переменные\n- Делать пробросы переменных в маршруты, а
      не записывать числа хардкодом\n\n\n## Тесты контроллеров:\n\n- Импортировать
      модель пользователя из моделей\n- Рассчитывать URLы заранее\n- Убрать продублированную
      проверку используемых шаблонов\n- Дать локальным переменным методов соответствующие
      названия\n- Добавить тесты пагинатора\n- Корректно создавать объекты постов
      для теста пагинатора\n- Импортировать число постов для пагинации из настроек\n
      - Считать число постов на 2й странице пагинатора, а не писать хардкодом\n\n\n
      Не забываем пушить миграции в репозиторий."

  - trigger: \4_юзер
    replace: Стоит импортировать модель пользователя из моделей вместе с постом и
      группой.
  - trigger: \4_присвоение_ключа
    replace: "Поле id/pk создаётся и обновляется Django автоматически [по умолчанию](https://docs.djangoproject.com/en/4.1/topics/db/models/#automatic-primary-key-fields).
      Стоит оставить его таковым.\n\nТакже при проектировании тестов стоит учитывать,
      что генератор первичного ключа может быть с кастомным шагом (не +1 для каждой
      записи, а, например, со случайным шагом для каждой новой записи).\n"
  - trigger: \4_компактные_реверсы
    replace: "Можно заменить расчёт url на более компактный.\n\nВместо\n\n```\nreverse(имя
      контроллера, kwargs={словарь с ключевыми аргументами и их значениями})\n```\n
      \nИспользовать\n\n```\nreverse(имя контроллера, args=[список позиционных аргументов
      контроллера])\n```\n"
  - trigger: \4_тесты_маршрутов
    replace: "## Тесты маршрутов:\n\nМожно объявить модуль test_routes.py, чтобы проверить,
      что контроллеры и эндпоинты состыкованы корректно:\n\n- “/” - результат расчёта
      по имени маршрута “index”\n- “/create” - результат расчёта по имени маршрута
      “post_create”\n- “/group*<конкретный слаг>” - результат расчёта по имени маршрута
      “group_list”\n"
  - trigger: \4_базовый_класс_тестов
    replace: "Нужно создать базовый класс тестов, который будет хранить в себе константы
      и атрибуты.\n\nКонстанты:\n\n- Имена пользователей\n- Постоянные слаги\n- Постоянные
      реверсы; реверсы, зависящие от постоянных данных\n\nАтрибуты:\n\n- Пользователи\n
      - Группы, которые используются для создания и проверки редактирования постов\n
      - Тестовые посты (в т.ч. множество постов для теста пагинатора)\n- Реверсы,
      зависящие от пользователей / постов / групп, объявленных в базовом тесте\n-
      Авторизованный и неавторизованный клиенты, от лица которых идут обращения к
      API\n\n\nОстальные классы тестов стоит наследовать от базового класса и пользоваться
      соответствующими атрибутами\n"
  - trigger: \4_доступ_к_экземпляру
    replace: "Доступ к экземпляру происходит через self.\n\nЕсли атрибут объявлен
      на уровне класса, он будет доступен каждому экземпляру класса.\n"
  - trigger: \4_нейминг_маршрутов
    replace: "Для понятного нейминга URL, реверсов и редиректов попробуй использовать
      следующее правило:\n\n```\n<маршрут>_URL\nили\n<маршрут>_REVERSE\nили\n<маршрут>_REDIRECT\n\
      ```"
  - trigger: \4_логическая_ошибка
    replace: "Логическая ошибка:\n\n- Тут не проверяются атрибуты созданного поста
      - тут проверяется, что в базе есть пост с такими атрибутами. Если по ошибке
      (а ведь тесты и должны искать ошибки) вместо создания произойдет редактирование,
      то эта проверка ничего не проверит.\n\nДолжны быть следующие проверки:\n\n-
      Текст поста должен быть таким же, что и текст формы\n- Автором поста должен
      являться наш юзер\n- Пост относится к той же группе, что и группа, указанная
      в форме\n"
  - trigger: \4_edit
    replace: "Хрупкая проверка редактируемого поста.\n\nУ нас уже есть заготовленный
      пост, поля которого мы меняем. Меняются все поля, кроме id (эквивалентно pk)
      - данное поле доступно только для чтения. Значит при изменении поста мы сможем
      достоверно его достать по id.\n\nНе хватает проверки на следующие поля:\n\n
      - Автор поста\n- Группа поста\n- Текст поста\n"
  - trigger: \4_latest
    replace: "Хрупкий способ доставать последний созданный пост.\n\nСтоит воспользоваться
      методом [latest](https://docs.djangoproject.com/en/4.1/ref/models/querysets/#latest)."

  - trigger: \4_проверки_контекстов
    replace: "В проверках контроллеров index, group_list, profile и post_detail используются
      одинаковые операции:\n\n- Достать пост из контекста\n- Сравнить атрибуты поста
      из контекста с постом в фикстуре\n\nПри этом текущий код разнесён по 4 методам.
      Стоит собрать в 1 метод с использованием subTest."
  - trigger: \4_громоздкий_способ
    replace: Громоздкий способ брать список. Стоит воспользоваться list comprehension.
  - trigger: \4_сабтест
    replace: "Достаточно использовать словарь и записать проверки для нескольких моделей
      в 1 цикл с subTest:\n\n```python\nexpected_results = {\n    Post: {<field: value
      mapping>},\n    Group: {<field: value mapping>},\n    }\nfor model, result in
      expected_results.items():\n    for field, value in result.items():\n       \
      \ with self.subTest(value=value):\n        …\n\n```"
  - trigger: \4_группа
    replace: "Нужно проверять редактирование на новой группе.\n\nСтоит учитывать,
      что все экземпляры моделей стоит объявлять в методе `.setUpClass()`."
  - trigger: \4_контексты
    replace: "В проверках контроллеров index, group_list, profile и post_detail используются
      одинаковые операции:\n\n- Достать пост из контекста\n- Сравнить атрибуты поста
      из контекста с постом в фикстуре\n\nПри этом текущий код разнесён по 4 методам.
      Стоит собрать в 1 метод с использованием subTest."
  - trigger: \4_проверка_шаблонов
    replace: "Продублированная проверка.\n\nМы уже протестировали соответствие эндпоинтов
      и шаблонов в тестах маршрутизатора."
  - trigger: \4_редиректы
    replace: Стоит вынести проверки редиректов в отдельный метод.
  - trigger: \4_проверки_полей
    replace: Проверки соответствия полей формы стоит вынести в тесты форм.
