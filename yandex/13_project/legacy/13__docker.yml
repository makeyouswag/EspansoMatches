matches:
  - trigger: \13_poetry
    replace: "В качестве менеджера пакетов рекомендую использовать poetry.\n\nПлан
      действий:\n\n1. Поставить зависимости проекта на poetry \n2. Сдать мне работу
      с pyproject.toml и  requirements.txt (обход системы тестирования - не канон)
      \n3. Удалить файл requirements.txt из репозитория"
  - trigger: \13_service
    replace: "Файлы gunicorn_kittygram и gunicornkitty.service дублируют логику.\n
      Рекомендую оставить файл с расширением .service - будет ясно, что для развёртывания
      проекта нужно запустить демона.\n"
  - trigger: \13_удоли
    replace: "> Обязательно удоли файл requirements.txt из репозитория!\n> В инфраструктуре
      не должно быть конфликтов, а подобное дублирование может начать накапливать
      ошибку с момента открытия проекта"
